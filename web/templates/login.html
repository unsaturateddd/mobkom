<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MobKom Robot</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0f0f23; color: #e0e0e0; min-height: 100vh; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .card { background: #1a1a2e; border-radius: 12px; padding: 24px; margin-bottom: 20px; border: 1px solid #2a2a4a; }
        .header { text-align: center; padding: 40px 0; }
        .header h1 { font-size: 2.5em; background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header p { color: #888; margin-top: 10px; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: linear-gradient(135deg, #1a1a2e, #16213e); border-radius: 12px; padding: 20px; text-align: center; border: 1px solid #2a2a4a; }
        .stat-card .number { font-size: 2.5em; font-weight: bold; background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .stat-card .label { color: #888; margin-top: 5px; }
        .btn { display: inline-block; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: 600; transition: all 0.3s; cursor: pointer; border: none; }
        .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4); }
        .btn-danger { background: #e74c3c; color: white; }
        .btn-sm { padding: 5px 12px; font-size: 0.9em; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #2a2a4a; }
        th { background: #16213e; color: #667eea; }
        tr:hover { background: #1a1a2e; }
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 0.85em; }
        .badge-admin { background: #9b59b6; color: white; }
        .badge-mod { background: #3498db; color: white; }
        .badge-trader { background: #2ecc71; color: white; }
        .badge-online { background: #2ecc71; color: white; }
        .badge-offline { background: #e74c3c; color: white; }
        .nav { display: flex; gap: 15px; margin-bottom: 30px; flex-wrap: wrap; }
        .nav a { color: #667eea; text-decoration: none; padding: 8px 16px; border-radius: 8px; background: #1a1a2e; border: 1px solid #2a2a4a; }
        .nav a:hover { background: #2a2a4a; }
        .log-entry { padding: 10px; border-left: 3px solid #667eea; margin-bottom: 8px; background: #16213e; border-radius: 0 8px 8px 0; font-size: 0.9em; }
        .log-entry .time { color: #667eea; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: #888; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #2a2a4a; background: #16213e; color: white; }
        .login-box { max-width: 400px; margin: 100px auto; }
        .login-box input[type="password"] { width: 100%; padding: 15px; border-radius: 8px; border: 1px solid #2a2a4a; background: #16213e; color: white; font-size: 1.1em; margin-bottom: 15px; }
        .login-box .btn { width: 100%; padding: 15px; }
        .section-title { font-size: 1.3em; margin-bottom: 15px; color: #667eea; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>MobKom Robot</h1>
            <p>Панель управления системой</p>
        </div>
        <div class="login-box card">
            <h2 class="section-title">Вход в панель</h2>
            {% if error %}
            <p style="color: #e74c3c; margin-bottom: 15px;">{{ error }}</p>
            {% endif %}
            <form method="post" action="/login">
                <input type="password" name="password" placeholder="Пароль" required>
                <button type="submit" class="btn btn-primary">Войти</button>
            </form>
        </div>
    </div>
</body>
</html>
